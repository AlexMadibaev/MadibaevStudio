<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MGS Admin Login</title>
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="admin-login">
    <main class="admin-login-card">
      <a class="admin-brand" href="/" aria-label="Madibaev Graphic Studio">
        <img src="assets/mgs-logo.svg" alt="MGS">
      </a>
      <p class="admin-eyebrow">MGS Admin / Sign In</p>
      <h1>Welcome back.</h1>
      <p>Enter the admin password to manage projects, case studies and enquiries.</p>

      <form id="login">
        <div class="admin-field">
          <label>
            <span>Password</span>
            <input required autofocus type="password" name="password" autocomplete="current-password">
          </label>
        </div>
        <button class="admin-button" type="submit">Sign in</button>
        <p class="admin-message" id="error" aria-live="polite"></p>
      </form>

      <p class="admin-login-footnote">Protected local session. Access expires when you log out or restart the server.</p>
    </main>

    <script>
      const form = document.querySelector("#login");
      const error = document.querySelector("#error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";

        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: new FormData(form).get("password") })
        });

        if (response.ok) {
          location = "/admin.html";
          return;
        }

        error.textContent = "Invalid password.";
        error.className = "admin-message is-error";
      });
    </script>
  </body>
</html>
