<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0b0b0c">
    <meta name="description" content="Проект Madibaev Graphic Studio.">
    <title>MGS — Проект</title>
    <link rel="icon" href="assets/mgs-logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="case.css">
    <script src="i18n.js" defer></script>
    <script src="project.js" defer></script>
  </head>
  <body class="case-page">
    <header class="case-header">
      <a class="logo" href="/"><img src="assets/mgs-logo.svg" alt="Madibaev Graphic Studio"></a>
      <a class="case-header-back" href="/#work">К работам</a>
      <a class="cta small" href="/#contact">Начать проект <img src="assets/icons/arrow-up-right.svg" alt=""></a>
    </header>
    <main class="wrap case">
      <section class="case-intro" aria-labelledby="title">
        <a class="link case-back" href="/#work">← К работам</a>
        <p class="meta" id="meta">ЗАГРУЗКА</p>
        <h1 id="title">Проект</h1>
      </section>

      <div class="case-hero" id="art" role="img" aria-label=""></div>

      <section class="case-details" id="case-details" aria-label="Детали проекта">
        <dl>
          <div>
            <dt id="detail-services-label">Услуги</dt>
            <dd id="detail-services">—</dd>
          </div>
          <div>
            <dt id="detail-year-label">Год</dt>
            <dd id="detail-year">—</dd>
          </div>
          <div>
            <dt id="detail-type-label">Направление</dt>
            <dd id="detail-type">—</dd>
          </div>
        </dl>
      </section>

      <section class="case-story" aria-labelledby="story-label">
        <p class="case-story-label" id="story-label">О ПРОЕКТЕ</p>
        <div id="blocks"></div>
      </section>

      <section class="case-next" aria-labelledby="case-contact-title">
        <p class="case-story-label" id="case-contact-kicker">НОВЫЙ ПРОЕКТ</p>
        <h2 id="case-contact-title">Есть задача?<br>Давайте обсудим.</h2>
        <a class="cta case-contact" href="/#contact">Начать проект <img src="assets/icons/arrow-up-right.svg" alt=""></a>
      </section>
    </main>
    <footer class="case-footer">
      <span id="case-footer-place">Душанбе · Весь мир</span>
      <a href="mailto:hello@madibaev.studio">hello@madibaev.studio</a>
    </footer>
  </body>
</html>
